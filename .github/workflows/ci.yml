# Workflow（工作流）的名称，会显示在 GitHub Actions 页面
name: Build Project

# 定义触发条件
on:

  # 当发生 git push 时触发
  push:

    # 只有 push 到下面这些分支时才会执行
    branches:
      - main          # main 分支
      - web-LifeLog   # web-LifeLog 分支

# 定义所有任务（Job）
jobs:

  # Job 的名字，可以随便起
  build:

    # 指定运行环境
    # GitHub 会自动创建一台 Ubuntu 最新版虚拟机来执行整个流程
    runs-on: ubuntu-latest

    # 一个 Job 由多个 Step（步骤）组成
    steps:

      # ============================
      # Step 1：下载仓库源码
      # ============================

      # 当前步骤显示的名称
      - name: Checkout

        # 使用 GitHub 官方提供的 checkout Action
        # 作用等价于：
        # git clone 你的仓库
        uses: actions/checkout@v4

      # ============================
      # Step 2：安装 Java 环境
      # ============================

      # 当前步骤名称
      - name: Setup Java

        # 使用官方 Java 安装 Action
        uses: actions/setup-java@v4

        # 传递给 Action 的配置参数
        with:

          # 指定 JDK 的发行版
          # temurin 是目前最常用的 OpenJDK 发行版（推荐）
          distribution: temurin

          # 安装 Java 21
          java-version: 21

          # 开启 Maven 依赖缓存
          # 第一次会下载依赖
          # 第二次开始直接读取缓存，大幅提高构建速度
          cache: maven

      # ============================
      # Step 3：编译 Spring Boot
      # ============================

      # 当前步骤名称
      - name: Build Backend

        # 指定工作目录
        # 等价于：
        # cd backend
        working-directory: backend

        # 执行 Shell 命令
        # 等价于终端输入：
        #
        # mvn clean package
        #
        # clean：
        #     删除 target 目录
        #
        # package：
        #     编译项目
        #     执行测试
        #     打包 Jar
        run: mvn clean package

      # ============================
      # Step 4：安装 Node.js
      # ============================

      # 当前步骤名称
      - name: Setup Node

        # 使用官方 Node 安装 Action
        uses: actions/setup-node@v4

        with:

          # 安装 Node.js 22
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ============================
      # Step 5：安装前端依赖
      # ============================

      # 当前步骤名称
      - name: Install Frontend Dependencies

        # 切换到 frontend 目录
        working-directory: frontend

        # 安装 package.json 中的所有依赖
        #
        # 第一次可能下载几十甚至上百个包
        run: npm ci

      # ============================
      # Step 6：编译 Vue 项目
      # ============================

      # 当前步骤名称
      - name: Build Frontend

      # 切换到 frontend
        working-directory: frontend

        # 执行 package.json 中的 build 命令
        #
        # 等价于：
        # npm run build
        #
        # 会生成 dist 目录
        # 如果存在语法错误、TypeScript 错误等会直接失败
        run: npm run build