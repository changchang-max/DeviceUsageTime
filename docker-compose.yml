# ============================================
# Docker Compose — 设备使用时间追踪系统
#
# 服务清单：
#   mysql    — MySQL 8.0 数据库
#   redis    — Redis 7 缓存
#   backend  — Spring Boot 后端 (Java 17)
#   frontend — Vue3 前端 (Nginx)
#
# 使用方式：
#   1. 复制 .env.example 为 .env 并填写真实值
#   2. docker compose up -d --build
# ============================================

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: dut-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deviceusagetime}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动建表；结构与实体/Mapper 一一对应
      - ./server/backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: dut-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    ports:
      # 注意：不能用 REDIS_PORT，该变量会被后端当作容器内 Redis 端口读取
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ========== Spring Boot 后端 ==========
  backend:
    build:
      context: ./server/backend
      dockerfile: Dockerfile
    image: deviceusagetime-backend:1.0
    container_name: dut-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PUBLISH_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      # ---------- MySQL（application.yaml 的 ${MYSQL_HOST} 等占位符） ----------
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deviceusagetime}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # ---------- Redis（application.yaml 使用 ${REDIS_HOST}/${REDIS_PORT}） ----------
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      # ---------- 邮件 ----------
      EMAIL_SENDER: ${EMAIL_SENDER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      # ---------- JWT ----------
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # ---------- 跨域：同域 Nginx 反代，留空即可 ----------
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # ---------- 实时推送 ----------
      REALTIME_BROKER: ${REALTIME_BROKER:-memory}
      # ---------- JVM 参数 ----------
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - backend_logs:/app/logs

  # ========== Vue3 前端 (Nginx) ==========
  frontend:
    build:
      context: ./server/frontend
      dockerfile: Dockerfile
    image: deviceusagetime-frontend:1.0
    container_name: dut-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLISH_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
      # 域名（Nginx server_name，默认 _ 匹配所有 Host）
      DOMAIN: ${DOMAIN:-_}
      # 后端地址（Nginx 反向代理目标，默认 Docker 内部网络）
      BACKEND_HOST: ${BACKEND_HOST:-backend:8080}
      # 后端主机名（供 resolver 动态解析）
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend}

volumes:
  mysql_data:
  redis_data:
  backend_logs: